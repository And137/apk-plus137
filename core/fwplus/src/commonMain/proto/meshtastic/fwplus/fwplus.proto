// Firmware-plus (FW+) protocol additions, as implemented by the firmware-plus137 fork
// (https://github.com/And137/firmware-plus137, protobufs/meshtastic/{ondemand,node_mod,module_config,telemetry}.proto).
//
// Field numbers and types are copied 1:1 from the firmware so the wire format matches. Messages the firmware
// nests inside upstream messages (ModuleConfig.NodeModConfig, Telemetry's LocalStatsExtended, ...) are
// declared top-level here; nesting does not affect the encoding. They travel inside upstream messages as
// unknown fields and are read and written by org.meshtastic.core.fwplus.FwPlusProtoExtensions.
//
// Upstream-message field numbers carrying these types (see FwPlusFieldNumbers):
//   ModuleConfig / LocalModuleConfig: node_mod = 20, node_mod_admin = 21, broadcast_assist = 24
//   AdminMessage.ModuleConfigType:    NODEMOD_CONFIG = 19, NODEMOD_ADMIN_CONFIG = 20, BROADCAST_ASSIST_CONFIG = 23
//   Telemetry:                        local_stats_extended = 20
//   DeviceMetadata:                   hasNodemod = 21
//   PortNum:                          NODE_MOD_APP = 278, ON_DEMAND_APP = 354

syntax = "proto3";

package meshtastic.fwplus;

option java_package = "org.meshtastic.fwplus.proto";

// ---------------------------------------------------------------------------------------------------------
// NodeMod (port NODE_MOD_APP = 278): text status + emoji broadcast by FW+ nodes.
// ---------------------------------------------------------------------------------------------------------

message NodeMod {
  string text_status = 1;
  optional string emoji = 2;
  optional bool webmesh_heartbeat = 3;
}

// ModuleConfig.node_mod (20)
message NodeModConfig {
  string text_status = 1;
  string emoji = 2;
}

// ModuleConfig.node_mod_admin (21)
message NodeModAdminConfig {
  bool sniffer_enabled = 1;
  bool do_not_send_prv_over_mqtt = 2;
  bool local_stats_over_mesh_enabled = 3;
  bool local_stats_extended_over_mesh_enabled = 4;
  bool idlegame_enabled = 5;
  uint32 additional_chutil = 6;
  float additional_txutil = 7;
  uint32 additional_polite_channel_percent = 8;
  uint32 additional_polite_duty_cycle_percent = 9;
  float current_tx_util_limit = 10;
  uint32 current_max_channel_util_percent = 11;
  uint32 current_polite_channel_util_percent = 12;
  uint32 current_polite_duty_cycle_percent = 13;
  bool auto_responder_enabled = 14;
  string auto_responder_text = 15;
  bool auto_redirect_messages = 16;
  uint32 auto_redirect_target_node_id = 17;
  bool telemetry_limiter_enabled = 18;
  uint32 telemetry_limiter_packets_per_minute = 19;
  bool telemetry_limiter_auto_chanutil_enabled = 20;
  uint32 telemetry_limiter_auto_chanutil_threshold = 21;
  bool position_limiter_enabled = 22;
  uint32 position_limiter_time_minutes_threshold = 23;
  bool opportunistic_flooding_enabled = 24;
  uint32 opportunistic_base_delay_ms = 25;
  uint32 opportunistic_hop_delay_ms = 26;
  uint32 opportunistic_snr_gain_ms = 27;
  uint32 opportunistic_jitter_ms = 28;
  bool opportunistic_cancel_on_first_hear = 29;
  bool opportunistic_auto = 30;
  bool proactive_traceroute_enabled = 31;
  uint32 traceroute_stale_ratio_threshold_percent = 32;
  uint32 traceroute_global_cooldown_hours = 33;
  uint32 traceroute_per_dest_cooldown_hours = 34;
  uint32 traceroute_chanutil_threshold_percent = 35;
  uint32 traceroute_max_per_day = 36;
  uint32 traceroute_expanding_ring_initial_hop = 37;
  uint32 traceroute_expanding_ring_max_hops = 38;
  uint32 traceroute_probe_jitter_ms = 39;
  uint32 route_ttl_base_hours = 40;
  uint32 route_ttl_per_conf_hours = 41;
  uint32 route_ttl_max_hours = 42;
  uint32 min_confidence_to_use = 43;
  uint32 hysteresis_cost_threshold_tenths = 44;
  bool force_disable_https = 45;
  // FW+ 1374: keep hop_limit when a router relays a router's packet (no favorites needed); off by default.
  bool zero_hop_routers = 46;
  // Hops are kept only while channel utilization is below this percentage; 0 = firmware default (25).
  uint32 zero_hop_max_chutil = 47;
  // Only when the previous relay was heard directly (hops_away 0).
  bool zero_hop_direct_only = 48;
}

// ModuleConfig.broadcast_assist (24)
message BroadcastAssistConfig {
  bool enabled = 1;
  uint32 degree_threshold = 2;
  uint32 dup_threshold = 3;
  uint32 window_ms = 4;
  uint32 max_extra_hops = 5;
  uint32 jitter_ms = 6;
  bool airtime_guard = 7;
  repeated uint32 allowed_ports = 8;
}

// Telemetry.local_stats_extended (20)
message LocalStatsExtended {
  optional uint32 memory_free_cheap = 1;
  optional uint32 memory_total = 2;
  optional uint32 cpu_usage_percent = 3;
  optional uint32 flash_used_bytes = 4;
  optional uint32 flash_total_bytes = 5;
  optional uint32 memory_psram_free = 6;
  optional uint32 memory_psram_total = 7;
  optional uint32 rx_total_bytes = 8;
  optional uint32 tx_total_bytes = 9;
  float rx_avg_60_min = 10;
  repeated uint32 rx_packet_history = 11;
}

// ---------------------------------------------------------------------------------------------------------
// OnDemand (port ON_DEMAND_APP = 354): remote node statistics on request.
// ---------------------------------------------------------------------------------------------------------

message FwPlusVersion {
  uint32 version_number = 1;
}

message NodeStats {
  optional uint32 battery_level = 1;
  optional float voltage = 2;
  optional float channel_utilization = 3;
  optional float air_util_tx = 4;
  optional uint32 uptime_seconds = 5;
  optional uint32 num_packets_tx = 6;
  optional uint32 num_packets_rx = 7;
  optional uint32 num_packets_rx_bad = 8;
  optional uint32 num_online_nodes = 9;
  optional uint32 num_total_nodes = 10;
  optional uint32 num_rx_dupe = 11;
  optional uint32 num_tx_relay = 12;
  optional uint32 num_tx_relay_canceled = 13;
  optional uint32 reboots = 14;
  optional uint32 memory_free_cheap = 15;
  optional uint32 memory_total = 16;
  optional uint32 cpu_usage_percent = 17;
  optional uint32 flash_used_bytes = 18;
  optional uint32 flash_total_bytes = 19;
  optional uint32 memory_psram_free = 20;
  optional uint32 memory_psram_total = 21;
  optional uint32 rx_total_bytes = 22;
  optional uint32 tx_total_bytes = 23;
  optional float ch1_voltage = 24;
  optional float ch1_current = 25;
  optional float ch2_voltage = 26;
  optional float ch2_current = 27;
  optional float ch3_voltage = 28;
  optional float ch3_current = 29;
  optional uint32 flood_counter = 30;
  optional uint32 nexthop_counter = 31;
  optional string firmware_version = 32;
  optional uint32 blocked_by_hoplimit = 33;
  optional uint32 fw_plus_version = 34;
  optional uint32 rebroadcast_mode = 35;
  optional bool telemetry_limiter_enabled = 36;
  optional bool position_limiter_enabled = 37;
  optional uint32 opportunistic_mode = 38;
  optional bool opportunistic_enabled = 39;
  optional sint32 noise_floor = 40;
}

message RxPacketHistory {
  repeated uint32 rx_packet_history = 1;
}

message RxAvgTimeHistory {
  repeated uint32 rx_avg_history = 1;
}

message PortCounterEntry {
  uint32 port = 1;
  uint32 count = 2;
}

message PortCountersHistory {
  repeated PortCounterEntry port_counter_history = 1;
}

message RoutingErrorEntry {
  uint32 num = 1;
  uint32 counter = 2;
}

message RoutingErrorsHistory {
  repeated RoutingErrorEntry routing_errors = 1;
}

message AirActivityEntry {
  uint32 tx_time = 1;
  uint32 rx_time = 2;
  uint32 rxBad_time = 3;
}

message AirActivityHistory {
  repeated AirActivityEntry air_activity_history = 1;
}

message NodeEntry {
  uint32 node_id = 1;
  string long_name = 2;
  string short_name = 3;
  fixed32 last_heard = 4;
  float snr = 5;
  uint32 hops = 6;
  int32 rx_rssi = 7;
  optional sfixed32 latitude_i = 8;
  optional sfixed32 longitude_i = 9;
}

message ExchangeEntry {
  uint32 from_node = 1;
  uint32 to_node = 2;
  uint32 port_num = 3;
}

message ExchangeList {
  repeated ExchangeEntry exchange_list = 1;
}

message NodesList {
  repeated NodeEntry node_list = 1;
}

message Ping {
  optional int32 rx_rssi = 1;
  optional float snr = 2;
}

enum OnDemandType {
  UNKNOWN_TYPE = 0;
  REQUEST_PACKET_RX_HISTORY = 1;
  RESPONSE_PACKET_RX_HISTORY = 2;
  REQUEST_NODES_ONLINE = 3;
  RESPONSE_NODES_ONLINE = 4;
  REQUEST_PING = 5;
  RESPONSE_PING = 6;
  REQUEST_RX_AVG_TIME = 7;
  RESPONSE_RX_AVG_TIME = 8;
  REQUEST_PORT_COUNTER_HISTORY = 9;
  RESPONSE_PORT_COUNTER_HISTORY = 10;
  REQUEST_PACKET_EXCHANGE_HISTORY = 11;
  RESPONSE_PACKET_EXCHANGE_HISTORY = 12;
  REQUEST_AIR_ACTIVITY_HISTORY = 13;
  RESPONSE_AIR_ACTIVITY_HISTORY = 14;
  REQUEST_NODE_STATS = 15;
  RESPONSE_NODE_STATS = 16;
  REQUEST_FW_PLUS_VERSION = 17;
  RESPONSE_FW_PLUS_VERSION = 18;
  REQUEST_ROUTING_ERRORS = 19;
  RESPONSE_ROUTING_ERRORS = 20;
  REQUEST_PING_ACK = 21;
  RESPONSE_PING_ACK = 22;
  REQUEST_NODES_DIRECT_ONLINE = 23;
  REQUEST_ROUTING_TABLE = 24;
  RESPONSE_ROUTING_TABLE = 25;
  // fw+ noise floor history (numbers taken over from the dropped DTN overlay), build 1372+
  REQUEST_NOISE_FLOOR_HISTORY = 26;
  RESPONSE_NOISE_FLOOR_HISTORY = 27;
  REQUEST_BROADCAST_ASSIST_STATS = 28;
  RESPONSE_BROADCAST_ASSIST_STATS = 29;
}

message OnDemandRequest {
  OnDemandType request_type = 1;
}

message OnDemandResponse {
  OnDemandType response_type = 1;
  oneof response_data {
    RxPacketHistory rx_packet_history = 2;
    NodesList node_list = 3;
    Ping ping = 4;
    RxAvgTimeHistory rx_avg_time_history = 5;
    PortCountersHistory port_counter_history = 6;
    ExchangeList exchange_packet_log = 7;
    AirActivityHistory air_activity_history = 8;
    NodeStats node_stats = 9;
    FwPlusVersion fw_plus_version = 10;
    RoutingErrorsHistory routing_errors = 11;
    RoutingTable routing_table = 12;
    NoiseFloorHistory noise_floor_history = 13;
    BroadcastAssistStats broadcast_assist_stats = 14;
  }
}

message OnDemand {
  optional uint32 packet_index = 1;
  optional uint32 packet_total = 2;
  oneof variant {
    OnDemandRequest request = 3;
    OnDemandResponse response = 4;
  }
}

enum RouteSource {
  ROUTE_SOURCE_UNSPECIFIED = 0;
  ROUTE_SOURCE_DV_ETX = 1;
  ROUTE_SOURCE_LEGACY = 2;
}

message RoutingTableEntry {
  uint32 dest = 1;
  uint32 next_hop = 2; // last byte of the next hop's node number
  float cost = 3;
  uint32 confidence = 4;
  uint32 age_secs = 5;
  RouteSource source = 6;
}

message RoutingTable {
  repeated RoutingTableEntry routes = 1;
}

// fw+ noise floor history: averages of 20 consecutive RSSI samples, newest first
message NoiseFloorHistory {
  // average noise floor in dBm
  repeated sint32 noise_floor = 1;
  // seconds since each average was taken
  repeated uint32 age_secs = 2;
}

message BroadcastAssistStats {
  optional bool enabled = 1;
  optional uint32 reflood_attempts = 2;
  optional uint32 reflood_sent = 3;
  optional uint32 suppressed_dup = 4;
  optional uint32 suppressed_degree = 5;
  optional uint32 suppressed_airtime = 6;
  optional uint32 last_reflood_age_secs = 7;
}
